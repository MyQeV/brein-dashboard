name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brein
          POSTGRES_PASSWORD: password  # pragma: allowlist secret
          POSTGRES_DB: brein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brein -d brein_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://brein:password@localhost:5432/brein_test  # pragma: allowlist secret
      BREIN_TEST_DATABASE_URL: postgresql+asyncpg://brein:password@localhost:5432/brein_test  # pragma: allowlist secret
      BREIN_SECRET_KEY: ci  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # PageProps/LayoutProps are generated; a fresh checkout has none.
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm exec biome check src

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
